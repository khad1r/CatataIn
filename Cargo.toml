[workspace]
resolver = "2"
members = [
    "crates/catetin-core",
    "crates/catetin-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Catetin Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
hound = "3.5"
cpal = "0.15"
rubato = "0.15"
