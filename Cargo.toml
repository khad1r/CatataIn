[workspace]
resolver = "2"
members = [
    "crates/catetin-core",
    "crates/catetin-cli",
    "crates/catetin-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Catetin Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
log = { version = "0.4", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.15"
