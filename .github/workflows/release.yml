name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build-binaries:
    name: Build Multiplatform Binaries via Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build all targets (Windows, Linux, WASM) via Docker
        run: docker build --target export --output dist/ .

      - name: Package Release Archives
        run: |
          cd dist
          zip -9 catetin-windows-x64.zip catetin.exe
          tar -czf catetin-linux-x64.tar.gz catetin-linux
          zip -9 catetin-wasm.zip catetin_wasm.wasm

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: |
            dist/catetin-windows-x64.zip
            dist/catetin-linux-x64.tar.gz
            dist/catetin-wasm.zip

  release:
    name: Semantic Release
    needs: build-binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Windows Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx \
            --package semantic-release \
            --package @semantic-release/changelog \
            --package @semantic-release/git \
            --package @semantic-release/github \
            semantic-release
