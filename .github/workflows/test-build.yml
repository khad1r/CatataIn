name: Test & Build

on:
  pull_request:
    branches:
      - main
      - development
  push:
    branches:
      - development

jobs:
  test-and-build:
    name: Lint, Check & Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run Core Engine Unit Tests
        run: cargo test --workspace --no-default-features

      - name: Test production CLI build
        run: cargo build --release -p catetin-cli

      - name: Copy native runtime DLLs for Windows smoke test
        run: Copy-Item crates/catetin-core/native/win-x64/*.dll target/release/

      - name: Verify CLI smoke test
        run: |
          .\target\release\catetin.exe --version
          .\target\release\catetin.exe --help

      - name: Test WebAssembly build
        run: cargo build --target wasm32-unknown-unknown --release -p catetin-wasm
