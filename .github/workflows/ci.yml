name: Catetin CI & Cross-Platform Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # 1. Native Windows Build (catetin.exe with full WASAPI capture)
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Core Tests
        run: cargo test --workspace --no-default-features

      - name: Build Release Binary (catetin.exe)
        run: cargo build --release -p catetin-cli

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: catetin-windows-x64
          path: target/release/catetin.exe

  # 2. Linux & WebAssembly Verification
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Linux audio development packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Check Core Engine for WebAssembly target
        run: cargo check -p catetin-core --target wasm32-unknown-unknown --no-default-features
