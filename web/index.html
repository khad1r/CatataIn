<!DOCTYPE html>
<html lang="id">
<head>

  <link rel="manifest" href="manifest.json">

<body>

    <div class="brand">
      <h1>Catetin</h1>

      <button id="btn-clear" class="btn btn-subtle" title="Hapus">Hapus</button>

  <main>

    <notes-view></notes-view>
