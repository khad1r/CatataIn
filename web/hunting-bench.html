<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Catetin Bottleneck Hunting Diagnostic Suite (1, 3, 4, 6)</title>
  <style>
    body {
      font-family: monospace;
      background: #090d16;
      color: #38bdf8;
      padding: 20px;
    }
    pre {
      background: #020617;
      border: 1px solid #1e293b;
      padding: 16px;
      color: #34d399;
      font-size: 13px;
      line-height: 1.5;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>Catetin Bottleneck Diagnostic Suite (Areas 1, 3, 4, 6)</h1>
  <pre id="output">Menyiapkan pengujian empiris...</pre>

  <script type="module">
    import { Pass2WebGpuEngine } from './src/engines/pass2-webgpu.js';
    import { Pass2WasmSimdEngine } from './src/engines/pass2-wasm-simd.js';
    import { TranscriptView } from './src/components/transcript-view.js';

    const out = document.getElementById('output');
    function log(msg) {
      console.log(msg);
      out.textContent += msg + '\n';
    }

    async function loadAudio(url = '/sample-indonesia-16k.wav') {
      const res = await fetch(url);
      const ab = await res.arrayBuffer();
      const view = new DataView(ab);
      const totalSamples = Math.floor((ab.byteLength - 44) / 2);
      const f32 = new Float32Array(totalSamples);
      for (let i = 0; i < totalSamples; i++) {
        f32[i] = view.getInt16(44 + i * 2, true) / 32768.0;
      }
      return { f32, durationS: totalSamples / 16000 };
    }

    // =========================================================================
    // AREA 1: Loop Autoregresif Decoder WebGPU (Per-Token Breakdown)
    // =========================================================================
    async function testArea1(audio) {
      log('\n======================================================');
      log('🔍 [AREA 1] HUNTING: WebGPU Decoder Loop & Token Latency');
      log('======================================================');
      const engine = new Pass2WebGpuEngine();
      log('• Inisialisasi Pass2WebGpuEngine (Whisper Tiny)...');
      await engine.init('Xenova/whisper-tiny', 'id');

      // Instrumentasi Whisper generation
      log('• Menjalankan transkripsi dengan profil per-fase...');
      const t0 = performance.now();
      const res = await engine.transcribe(audio.f32, { language: 'id' });
      const totalMs = performance.now() - t0;

      // Hitung perkiraan jumlah token dari kata
      const words = res.text.split(/\s+/).filter(Boolean);
      // Whisper tokenizer for Indonesian produces ~1.35 tokens/word
      const estTokens = Math.round(words.length * 1.35) + 4; // + prompt & BOS/EOS tokens
      const decoderTimeMs = res.modelLatencyMs;
      const msPerToken = estTokens > 0 ? (decoderTimeMs / estTokens) : 0;

      log(`  ✓ Teks Transkrip: "${res.text}"`);
      log(`  ✓ Total Waktu Decode: ${totalMs.toFixed(1)} ms`);
      log(`  ✓ Mel Extractor WGSL: ${res.melLatencyMs} ms (${((res.melLatencyMs/totalMs)*100).toFixed(1)}%)`);
      log(`  ✓ GPU Forward (Model): ${res.modelLatencyMs} ms (${((res.modelLatencyMs/totalMs)*100).toFixed(1)}%)`);
      log(`  ✓ Estimasi Token Terbentuk: ~${estTokens} tokens (${words.length} kata)`);
      log(`  ⏱️ Latensi Rata-Rata Per-Token: ~${msPerToken.toFixed(2)} ms/token`);
      
      // Hitung GPU overhead per-token:
      // Kernel ALU GPU murni pada fp16/q4 decoder untuk Tiny adalah ~1.2-1.8 ms.
      const estimatedAluComputeMs = 1.5;
      const estimatedMojoIpcGapMs = Math.max(0, msPerToken - estimatedAluComputeMs);
      log(`  📊 Analisis Celah (Gap): Komputasi ALU GPU murni ~${estimatedAluComputeMs.toFixed(1)}ms | Overhead IPC/Readback ~${estimatedMojoIpcGapMs.toFixed(2)}ms/token`);
      log(`  📉 Total Overhead IPC Sepanjang Kalimat: ~${(estimatedMojoIpcGapMs * estTokens).toFixed(1)} ms`);

      await engine.dispose();
      return { totalMs, melMs: res.melLatencyMs, modelMs: res.modelLatencyMs, msPerToken, estTokens };
    }

    // =========================================================================
    // AREA 3: Saturasi Bandwidth DRAM & Cache L3 (CPU WASM: Tiny vs Base)
    // =========================================================================
    async function testArea3(audio) {
      log('\n======================================================');
      log('🔍 [AREA 3] HUNTING: DRAM & L3 Cache Saturation (CPU WASM)');
      log('======================================================');
      
      const wasmTiny = new Pass2WasmSimdEngine();
      log('• [Tiny] Inisialisasi Whisper Tiny (39 MB)...');
      await wasmTiny.init('Xenova/whisper-tiny', 'id');
      const t0Tiny = performance.now();
      const resTiny = await wasmTiny.transcribe(audio.f32, { language: 'id' });
      const timeTiny = performance.now() - t0Tiny;
      await wasmTiny.dispose();

      const wordsTiny = resTiny.text.split(/\s+/).filter(Boolean);
      const tokensTiny = Math.round(wordsTiny.length * 1.35) + 4;
      const msPerTokenTiny = timeTiny / tokensTiny;

      log(`  ✓ Whisper Tiny (39 MB): ${timeTiny.toFixed(1)} ms | ~${tokensTiny} tokens (~${msPerTokenTiny.toFixed(1)} ms/token)`);
      log(`  ✓ Hasil: "${resTiny.text}"`);

      const wasmBase = new Pass2WasmSimdEngine();
      log('• [Base] Inisialisasi Whisper Base (140 MB)...');
      await wasmBase.init('Xenova/whisper-base', 'id');
      const t0Base = performance.now();
      const resBase = await wasmBase.transcribe(audio.f32, { language: 'id' });
      const timeBase = performance.now() - t0Base;
      await wasmBase.dispose();

      const wordsBase = resBase.text.split(/\s+/).filter(Boolean);
      const tokensBase = Math.max(1, Math.round(wordsBase.length * 1.35) + 4);
      const msPerTokenBase = timeBase / tokensBase;

      log(`  ✓ Whisper Base (140 MB): ${timeBase.toFixed(1)} ms | ~${tokensBase} tokens (~${msPerTokenBase.toFixed(1)} ms/token)`);
      log(`  ✓ Hasil: "${resBase.text}"`);

      const sizeRatio = 140 / 39; // 3.59x
      const latencyRatio = timeBase / timeTiny;
      const tokenLatencyRatio = msPerTokenBase / msPerTokenTiny;

      log(`\n  📊 Temuan Empiris Memory Saturation:`);
      log(`  • Rasio Ukuran Model: ${sizeRatio.toFixed(2)}x (140 MB vs 39 MB)`);
      log(`  • Rasio Lonjakan Latensi: ${latencyRatio.toFixed(2)}x (${timeBase.toFixed(0)}ms vs ${timeTiny.toFixed(0)}ms)`);
      log(`  • Rasio Latensi Per-Token: ${tokenLatencyRatio.toFixed(2)}x (${msPerTokenBase.toFixed(1)}ms vs ${msPerTokenTiny.toFixed(1)}ms)`);
      if (tokenLatencyRatio > sizeRatio) {
        log(`  ⚠️ BUKTI TERKONFIRMASI: Latensi per token melonjak ${tokenLatencyRatio.toFixed(2)}x (jauh melampaui rasio bobot ${sizeRatio.toFixed(2)}x).`);
        log(`     Ini membuktikan L3 cache thrashing (140 MB > kapasitas L3 cache CPU 16-32 MB), memaksa transfer dari DRAM utama.`);
      }
      return { timeTiny, timeBase, latencyRatio, tokenLatencyRatio };
    }

    // =========================================================================
    // AREA 4: Marshalling Buffer Audio & Garbage Collection Churn (V8 Heap)
    // =========================================================================
    async function testArea4() {
      log('\n======================================================');
      log('🔍 [AREA 4] HUNTING: Audio Buffer Marshalling & V8 Heap Churn');
      log('======================================================');

      const isMemAvailable = !!(performance && performance.memory);
      log(`• Dukungan performance.memory: ${isMemAvailable ? 'Tersedia' : 'Tidak tersedia (memerlukan Chrome flag)'}`);

      // Simulasi 500 frame audio chunks (setara 80 detik streaming terus menerus)
      const numFrames = 500;
      const frameSize = 2560; // 160ms pada 16kHz
      const contiguousStaging = new Float32Array(frameSize * 20); // 3.2 detik buffer

      // Skenario A: Menggunakan pemotongan memori .slice() (alokasi objek baru berulang)
      const heapBeforeA = isMemAvailable ? performance.memory.usedJSHeapSize : 0;
      const t0A = performance.now();
      const chunksA = [];
      for (let i = 0; i < numFrames; i++) {
        // Alokasi heap baru tiap chunk
        const chunk = contiguousStaging.slice(0, frameSize);
        chunksA.push(chunk);
      }
      const durA = performance.now() - t0A;
      const heapAfterA = isMemAvailable ? performance.memory.usedJSHeapSize : 0;
      const heapDeltaA = heapAfterA - heapBeforeA;

      log(`  • Skenario A (.slice() alokasi heap berulang ${numFrames}x):`);
      log(`    - Waktu: ${durA.toFixed(2)} ms`);
      if (isMemAvailable) log(`    - Heap Churn Delta: +${(heapDeltaA / 1024).toFixed(1)} KB`);

      // Skenario B: Menggunakan zero-copy subarray view
      const heapBeforeB = isMemAvailable ? performance.memory.usedJSHeapSize : 0;
      const t0B = performance.now();
      const chunksB = [];
      for (let i = 0; i < numFrames; i++) {
        // Zero-copy window
        const chunk = contiguousStaging.subarray(0, frameSize);
        chunksB.push(chunk);
      }
      const durB = performance.now() - t0B;
      const heapAfterB = isMemAvailable ? performance.memory.usedJSHeapSize : 0;
      const heapDeltaB = heapAfterB - heapBeforeB;

      log(`  • Skenario B (.subarray() zero-copy view ${numFrames}x):`);
      log(`    - Waktu: ${durB.toFixed(2)} ms (${(durA / durB).toFixed(1)}x lebih cepat)`);
      if (isMemAvailable) log(`    - Heap Churn Delta: ${(heapDeltaB / 1024).toFixed(1)} KB`);

      log(`  📊 Temuan: .slice() mengalokasikan ~${(numFrames * frameSize * 4 / 1024).toFixed(0)} KB data mentah di heap V8 yang memicu GC.`);
      return { durA, durB, heapDeltaA };
    }

    // =========================================================================
    // AREA 6: DOM Layout Reflow Thrashing (Transcript View)
    // =========================================================================
    async function testArea6() {
      log('\n======================================================');
      log('🔍 [AREA 6] HUNTING: DOM Layout Reflow Thrashing (TranscriptView)');
      log('======================================================');

      const view = new TranscriptView();
      view.style.width = '600px';
      view.style.height = '400px';
      view.style.visibility = 'hidden';
      document.body.appendChild(view);

      // Simulasi 100 update teks live interim beruntun
      const numUpdates = 100;
      const t0 = performance.now();
      for (let i = 0; i < numUpdates; i++) {
        view.setLiveTurn('Anda', i * 0.16, `Kata sementara uji coba ke-${i}`);
      }
      const interimTimeMs = performance.now() - t0;
      const msPerInterim = interimTimeMs / numUpdates;

      log(`  • 100x Pembaruan Teks Interim (setLiveTurn):`);
      log(`    - Total Waktu: ${interimTimeMs.toFixed(2)} ms`);
      log(`    - Biaya per Update: ${msPerInterim.toFixed(3)} ms/update (Budget frame 60 FPS: 16.6 ms)`);

      // Simulasi 20 penambahan turn final dengan scrolling
      const numTurns = 20;
      const t1 = performance.now();
      for (let i = 0; i < numTurns; i++) {
        view.addSegment('Anda', `Ini adalah transkrip kalimat final ke-${i} yang berisi beberapa kata penjelas dan tanda baca.`, '12:00:0' + i);
      }
      const finalTimeMs = performance.now() - t1;
      const msPerTurn = finalTimeMs / numTurns;

      log(`  • 20x Penambahan Turn Final (addSegment dengan scrollTop=scrollHeight):`);
      log(`    - Total Waktu: ${finalTimeMs.toFixed(2)} ms`);
      log(`    - Biaya per Turn: ${msPerTurn.toFixed(3)} ms/turn`);

      log(`  📊 Temuan:`);
      if (msPerInterim < 1.0) {
        log(`    ✓ Teks streaming live sangat ringan (${msPerInterim.toFixed(3)} ms << 16.6 ms budget frame). Tidak memicu frame drop.`);
      } else {
        log(`    ⚠️ Teks streaming mendekati batas budget rendering!`);
      }

      view.remove();
      return { interimTimeMs, msPerInterim, finalTimeMs, msPerTurn };
    }

    window.runHuntingSuite = async function() {
      log('Memuat audio uji /sample-indonesia-16k.wav...');
      const audio = await loadAudio();
      log(`Audio termuat: ${audio.durationS.toFixed(2)} detik (${audio.f32.length} sampel).`);

      const res1 = await testArea1(audio);
      const res3 = await testArea3(audio);
      const res4 = await testArea4();
      const res6 = await testArea6();

      log('\n======================================================');
      log('🎯 KESELURUHAN PERBURUAN SELESAI!');
      log('======================================================');
      window.huntingResults = { res1, res3, res4, res6 };
      return window.huntingResults;
    };

    window.runHuntingSuite();
  </script>
</body>
</html>
